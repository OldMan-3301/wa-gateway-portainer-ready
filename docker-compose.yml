services:
  wa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Kabul
      PORT: "3000"
      OPENWA_BASE_URL: "http://openwa-api:2785"
      OPENWA_SESSION_ID: "${OPENWA_SESSION_ID}"
      OPENWA_API_KEY: "${OPENWA_API_KEY}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY}"
      REQUEST_TIMEOUT_MS: "30000"
      MAX_TEXT_LENGTH: "4096"
    networks:
      - openwa-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  openwa-network:
    external: true
    name: openwa-network
